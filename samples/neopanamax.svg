<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Neo-Panamax container ship starboard elevation, 4 pixels per metre">
  <rect width="1920" height="1080" fill="#141618"/>
  <rect width="1920" height="720" fill="#171c20"/>
  <rect y="720" width="1920" height="360" fill="#0e1316"/>
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#6aa0b8" stroke-width="1.5" opacity="0.7"/>
  <!-- 4 px/m. LOA 366 m = 1464 px, x=228. Draft 15.2 m = 60.8. Air draft 57.91 m = 231.64. Beam 51.25 m. ISO 40ft = 48.77 × 10.36. -->
  <g transform="translate(40 0)">
    <!-- hull -->
    <path d="M0 720 L40 700 L1400 700 L1464 720 L1464 780.8 L40 780.8 L0 760 Z" fill="#1c2226" stroke="#7ec8c0" stroke-width="1.6"/>
    <!-- container bays: 40ft = 48.77 px, 8 high × 10.36 = 82.9, deck at 700 -->
    <g stroke="#7ec8c0" stroke-width="0.6">
      <!-- 22 bays × 48.77 ≈ 1073, starting x=80 -->
      <g fill="#2a3338">
        <rect x="80" y="617.12" width="48.77" height="82.88"/>
        <rect x="128.77" y="617.12" width="48.77" height="82.88"/>
        <rect x="177.54" y="617.12" width="48.77" height="82.88"/>
        <rect x="226.31" y="617.12" width="48.77" height="82.88"/>
        <rect x="275.08" y="617.12" width="48.77" height="82.88"/>
        <rect x="323.85" y="617.12" width="48.77" height="82.88"/>
        <rect x="372.62" y="617.12" width="48.77" height="82.88"/>
        <rect x="421.39" y="617.12" width="48.77" height="82.88"/>
        <rect x="470.16" y="617.12" width="48.77" height="82.88"/>
      </g>
      <g fill="#323a40">
        <rect x="518.93" y="617.12" width="48.77" height="82.88"/>
        <rect x="567.7" y="617.12" width="48.77" height="82.88"/>
        <rect x="616.47" y="617.12" width="48.77" height="82.88"/>
        <rect x="665.24" y="617.12" width="48.77" height="82.88"/>
        <rect x="714.01" y="617.12" width="48.77" height="82.88"/>
        <rect x="762.78" y="617.12" width="48.77" height="82.88"/>
        <rect x="811.55" y="617.12" width="48.77" height="82.88"/>
        <rect x="860.32" y="617.12" width="48.77" height="82.88"/>
      </g>
      <g fill="#2a3338">
        <rect x="1000" y="617.12" width="48.77" height="82.88"/>
        <rect x="1048.77" y="617.12" width="48.77" height="82.88"/>
        <rect x="1097.54" y="617.12" width="48.77" height="82.88"/>
        <rect x="1146.31" y="617.12" width="48.77" height="82.88"/>
        <rect x="1195.08" y="617.12" width="48.77" height="82.88"/>
        <rect x="1243.85" y="617.12" width="48.77" height="82.88"/>
      </g>
    </g>
    <!-- accommodation aft -->
    <rect x="910" y="560" width="70" height="140" fill="#2a3238" stroke="#7ec8c0" stroke-width="1.1"/>
    <rect x="922" y="520" width="46" height="40" fill="#323a40" stroke="#7ec8c0" stroke-width="1"/>
    <rect x="934" y="488" width="22" height="32" fill="#c45c58"/>
    <!-- A length -->
    <path d="M0 820 L0 840 L1464 840 L1464 820" fill="none" stroke="#7ec8c0" stroke-width="1.2"/>
    <!-- B draft -->
    <path d="M20 720 L4 720 L4 780.8 L20 780.8" fill="none" stroke="#7ec8c0" stroke-width="1.2"/>
    <!-- F one 40ft box -->
    <path d="M80 600 L80 590 L128.77 590 L128.77 600" fill="none" stroke="#7ec8c0" stroke-width="1" opacity="0.8"/>
  </g>
  <!-- beam station 51.25 m = 205 px -->
  <g transform="translate(80 200)">
    <text x="0" y="0" fill="#8b949c" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="0.16em">STATION  ·  C beam</text>
    <rect x="0" y="16" width="205" height="80" fill="#1c2226" stroke="#7ec8c0" stroke-width="1.3"/>
    <rect x="0" y="96" width="205" height="60.8" fill="#0e1316" stroke="#6aa0b8" stroke-width="1"/>
    <g fill="#2a3338" stroke="#7ec8c0" stroke-width="0.5">
      <rect x="4" y="20" width="24" height="72"/>
      <rect x="30" y="20" width="24" height="72"/>
      <rect x="56" y="20" width="24" height="72"/>
      <rect x="82" y="20" width="24" height="72"/>
      <rect x="108" y="20" width="24" height="72"/>
      <rect x="134" y="20" width="24" height="72"/>
      <rect x="160" y="20" width="24" height="72"/>
      <rect x="186" y="20" width="15" height="72"/>
    </g>
    <path d="M0 176 L0 188 L205 188 L205 176" fill="none" stroke="#7ec8c0" stroke-width="1"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#8b949c">
    <text x="80" y="64" font-size="13" letter-spacing="0.28em">HULLSCALE  ·  PLATE 08</text>
    <text x="80" y="96" font-size="28" fill="#e8ecee">Neo-Panamax · starboard</text>
    <text x="80" y="128" font-size="14">Canal-max boxship. 4 pixels / metre. Lock A = 366 m, then F should read 12.192 m.</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7ec8c0">
    <text x="900" y="880">A  length</text>
    <text x="200" y="760">B  draft</text>
    <text x="80" y="410">C  beam</text>
    <text x="320" y="600">F  ISO 40ft</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949c">
    <rect x="1508" y="40" width="372" height="120" fill="#141618" opacity="0.92"/>
    <text x="1524" y="64">A  366 m     length</text>
    <text x="1524" y="84">B  15.2 m    draft</text>
    <text x="1524" y="104">C  51.25 m   beam</text>
    <text x="1524" y="124">F  12.192 m  ISO 40ft</text>
  </g>
</svg>
