<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="BOKA Vanguard starboard elevation with Starship on deck, 4 pixels per metre">
  <rect width="1920" height="1080" fill="#141618"/>
  <rect width="1920" height="760" fill="#171c20"/>
  <rect y="760" width="1920" height="320" fill="#0e1316"/>
  <line x1="0" y1="760" x2="1920" y2="760" stroke="#6aa0b8" stroke-width="1.5" opacity="0.7"/>
  <g opacity="0.18" stroke="#7ec8c0" stroke-width="1">
    <line x1="360" y1="140" x2="360" y2="980"/>
    <line x1="1460" y1="140" x2="1460" y2="980"/>
  </g>
  <!-- Hull 275 m × 15.5 m at 4 px/m = 1100 × 62, deck y=698, keel y=760 -->
  <rect x="360" y="698" width="1100" height="62" rx="2" fill="#1c2226" stroke="#7ec8c0" stroke-width="1.6"/>
  <!-- overall beam casings, depth of house -->
  <rect x="1280" y="618" width="160" height="80" fill="#22282c" stroke="#7ec8c0" stroke-width="1.2"/>
  <rect x="1400" y="598" width="40" height="20" fill="#2a3236" stroke="#7ec8c0" stroke-width="1"/>
  <!-- deck grid every 25 m = 100 px -->
  <g stroke="#7ec8c0" stroke-width="1" opacity="0.22">
    <line x1="460" y1="698" x2="460" y2="760"/>
    <line x1="560" y1="698" x2="560" y2="760"/>
    <line x1="660" y1="698" x2="660" y2="760"/>
    <line x1="760" y1="698" x2="760" y2="760"/>
    <line x1="860" y1="698" x2="860" y2="760"/>
    <line x1="960" y1="698" x2="960" y2="760"/>
    <line x1="1060" y1="698" x2="1060" y2="760"/>
    <line x1="1160" y1="698" x2="1160" y2="760"/>
    <line x1="1260" y1="698" x2="1260" y2="760"/>
    <line x1="1360" y1="698" x2="1360" y2="760"/>
  </g>
  <!-- Starship 50.3 m × 9 m = 201.2 × 36, on deck -->
  <g transform="translate(520 662)">
    <rect x="18" y="0" width="165.2" height="36" fill="#c9d2d6"/>
    <circle cx="18" cy="18" r="18" fill="#c9d2d6"/>
    <polygon points="183.2,0 201.2,18 183.2,36" fill="#d7e0e4"/>
    <rect x="18" y="0" width="165.2" height="36" fill="none" stroke="#e8ecee" stroke-width="1.2"/>
    <line x1="18" y1="0" x2="18" y2="36" stroke="#7ec8c0" stroke-width="1" opacity="0.5"/>
    <rect x="70" y="6" width="22" height="8" rx="1" fill="#7ec8c0" opacity="0.35"/>
    <rect x="110" y="22" width="14" height="8" rx="1" fill="#24282c" opacity="0.4"/>
  </g>
  <!-- letter tags -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7ec8c0">
    <text x="900" y="790">A  hull length</text>
    <text x="300" y="732">B  depth</text>
    <text x="520" y="648">C  diameter</text>
    <text x="590" y="720">D  ship length</text>
  </g>
  <g fill="none" stroke="#7ec8c0" stroke-width="1" opacity="0.7">
    <path d="M360 800 L360 820 L1460 820 L1460 800"/>
    <path d="M330 698 L310 698 L310 760 L330 760"/>
    <path d="M520 650 L500 650 L500 698"/>
    <path d="M520 710 L520 740 L721 740 L721 710"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#8b949c">
    <text x="80" y="64" font-size="13" letter-spacing="0.28em">HULLSCALE  ·  PLATE 01</text>
    <text x="80" y="96" font-size="28" fill="#e8ecee">Vanguard · starboard elevation</text>
    <text x="80" y="128" font-size="14">4 pixels / metre · lock A = 275 m, then C should read 9 m</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949c">
    <text x="1480" y="64">A  275 m   length</text>
    <text x="1480" y="84">B  15.5 m  depth</text>
    <text x="1480" y="104">C  9 m     diameter</text>
    <text x="1480" y="124">D  50.3 m  Ship length</text>
  </g>
</svg>
