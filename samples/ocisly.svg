<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Of Course I Still Love You drone ship plan, 10 pixels per metre">
  <rect width="1920" height="1080" fill="#141618"/>
  <rect width="1920" height="1080" fill="#0e1316"/>
  <!-- 10 px/m. 91 × 52 m = 910 × 520. Origin (505, 220). -->
  <g transform="translate(505 220)">
    <!-- barge deck -->
    <rect width="910" height="520" rx="6" fill="#1c2226" stroke="#7ec8c0" stroke-width="2"/>
    <!-- blast deck -->
    <rect x="40" y="40" width="830" height="440" fill="#24282c"/>
    <!-- landing octagon ~50 m across = 500 px, centered -->
    <polygon points="455,80 680,140 740,260 680,380 455,440 230,380 170,260 230,140" fill="#1a1e22" stroke="#c4a46a" stroke-width="3"/>
    <text x="455" y="268" text-anchor="middle" fill="#c4a46a" font-size="22" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="0.2em">OCISLY</text>
    <!-- corner thruster sponsons -->
    <rect x="-18" y="20" width="36" height="70" rx="4" fill="#2a3236" stroke="#7ec8c0" stroke-width="1"/>
    <rect x="892" y="20" width="36" height="70" rx="4" fill="#2a3236" stroke="#7ec8c0" stroke-width="1"/>
    <rect x="-18" y="430" width="36" height="70" rx="4" fill="#2a3236" stroke="#7ec8c0" stroke-width="1"/>
    <rect x="892" y="430" width="36" height="70" rx="4" fill="#2a3236" stroke="#7ec8c0" stroke-width="1"/>
    <!-- Falcon 9 first stage, top-down. Diameter 3.7 m = 37 px. Legs span ~18 m = 180. -->
    <g transform="translate(455 260)">
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#c9d2d6" stroke-width="3"/>
      <line x1="0" y1="-90" x2="0" y2="90" stroke="#c9d2d6" stroke-width="3"/>
      <circle r="18.5" fill="#c9d2d6" stroke="#e8ecee" stroke-width="1.4"/>
      <circle r="6" fill="#141618"/>
    </g>
    <!-- A length -->
    <path d="M0 -24 L0 -44 L910 -44 L910 -24" fill="none" stroke="#7ec8c0" stroke-width="1.2"/>
    <!-- B beam -->
    <path d="M-24 0 L-44 0 L-44 520 L-24 520" fill="none" stroke="#7ec8c0" stroke-width="1.2"/>
    <!-- C diameter -->
    <path d="M490 260 L520 260 L520 200" fill="none" stroke="#7ec8c0" stroke-width="1" opacity="0.8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#8b949c">
    <text x="80" y="64" font-size="13" letter-spacing="0.28em">HULLSCALE  ·  PLATE 05</text>
    <text x="80" y="96" font-size="28" fill="#e8ecee">Of Course I Still Love You</text>
    <text x="80" y="128" font-size="14">SpaceX ASDS, Marmac 304. 10 pixels / metre. Lock A = 91 m, then C should read 3.7 m.</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7ec8c0">
    <text x="900" y="192">A  length</text>
    <text x="430" y="480">B  beam</text>
    <text x="1040" y="430">C  diameter</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949c">
    <text x="1480" y="64">A  91 m     barge length</text>
    <text x="1480" y="84">B  52 m     barge beam</text>
    <text x="1480" y="104">C  3.7 m    Falcon 9 diameter</text>
    <text x="1480" y="124">D  18 m     landing-leg span</text>
  </g>
</svg>
